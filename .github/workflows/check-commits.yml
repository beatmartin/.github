name: Check PR Commits

on:
  workflow_call:
    secrets: {}

permissions:
  pull-requests: write

jobs:
  validate-commits:
    name: Validate commit history
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr view "${PR_URL}" --json commits > commits_data.json

      - name: Validate commits
        id: validate
        run: |
          cat << 'PYEOF' > validate.py
          import json, os, re, sys

          CONVENTIONAL_PATTERN = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-zA-Z0-9_-]+\))?: (.+)$"
          )

          def check_language(text):
              # Looks for characters typically used in Spanish
              spanish_chars = re.compile(r'[áéíóúÁÉÍÓÚñÑüÜ¿¡]')
              if spanish_chars.search(text):
                  return False
              return True

          def main():
              with open("commits_data.json", encoding="utf-8") as f:
                  data = json.load(f)

              commits = [c["messageHeadline"] for c in data.get("commits", [])]
              errors = []

              print("Reviewing commit history:")
              for msg in commits:
                  print(f"Evaluating: '{msg}'")
                  
                  # Ignore automatic merge commits
                  if msg.startswith("Merge branch") or msg.startswith("Merge pull request"):
                      print(" -> Ignored (Merge commit detected)")
                      continue

                  match = CONVENTIONAL_PATTERN.match(msg.strip())
                  if not match:
                      errors.append(f"Invalid format: '{msg}'")
                      continue
                  if not check_language(match.group(3)):
                      errors.append(f"Contains Spanish characters (ñ, accents, etc.): '{msg}'")

              github_output = os.environ["GITHUB_OUTPUT"]
              with open(github_output, "a", encoding="utf-8") as gh_out:
                  gh_out.write(f"valid={'false' if errors else 'true'}\n")

              if errors:
                  with open("errors.txt", "w", encoding="utf-8") as ef:
                      ef.write("\n".join(f"- {e}" for e in errors))
                  print("\n[X] Commit errors found.")
              else:
                  print("\n[OK] All commits meet the standard.")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          
          python validate.py

      - name: Comment errors on PR
        if: steps.validate.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "### [X] Pull Request Errors Found"
            echo ""
            echo "The following commits do not meet the project standards:"
            cat errors.txt
            echo ""
            echo "---"
            echo "### [i] How to fix your commits:"
            echo "1. If you only need to fix the **latest commit**, run:"
            echo "   \`git commit --amend\`"
            echo "2. If you need to fix **older or multiple commits**, use interactive rebase:"
            echo "   \`git rebase -i HEAD~N\` *(replace N with the number of commits to check)*"
            echo "   Change \`pick\` to \`reword\` (or \`r\`) for the commits you want to rename."
            echo "3. Once your local history is fixed, force push the changes to update this PR:"
            echo "   \`git push --force\`"
            echo ""
            echo "*Note: The bot will automatically re-evaluate your PR after the push.*"
          } > comment.md
          gh pr comment "${PR_URL}" --body-file comment.md
        
          # Force workflow failure to block PR without closing it
          exit 1