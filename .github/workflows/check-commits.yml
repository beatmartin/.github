name: Check PR Commits

on:
  workflow_call:
    secrets: {}

permissions:
  pull-requests: write

jobs:
  validate-commits:
    name: Validar historial de commits
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtener commits del PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr view "${PR_URL}" --json commits > commits_data.json

      - name: Validar commits
        id: validate
        run: |
          cat << 'PYEOF' > validate.py
          import json, os, re, sys

          CONVENTIONAL_PATTERN = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-zA-Z0-9_-]+\))?: (.+)$"
          )

          def check_language(text):
              # Busca caracteres típicamente usados en español (ñ, tildes, símbolos de apertura)
              spanish_chars = re.compile(r'[áéíóúÁÉÍÓÚñÑüÜ¿¡]')
              if spanish_chars.search(text):
                  return False
              return True

          def main():
              with open("commits_data.json", encoding="utf-8") as f:
                  data = json.load(f)

              commits = [c["messageHeadline"] for c in data.get("commits", [])]
              errors = []

              print("Revisando el historial de commits:")
              for msg in commits:
                  print(f"Evaluando: '{msg}'")
                  
                  # Ignorar commits de Merge automáticos
                  if msg.startswith("Merge branch") or msg.startswith("Merge pull request"):
                      print(" -> Ignorado (Commit de merge detectado)")
                      continue

                  match = CONVENTIONAL_PATTERN.match(msg.strip())
                  if not match:
                      errors.append(f"Formato inválido: '{msg}'")
                      continue
                  if not check_language(match.group(3)):
                      errors.append(f"Contiene caracteres en español (ñ, tildes, etc.): '{msg}'")

              github_output = os.environ["GITHUB_OUTPUT"]
              with open(github_output, "a", encoding="utf-8") as gh_out:
                  gh_out.write(f"valid={'false' if errors else 'true'}\n")

              if errors:
                  with open("errors.txt", "w", encoding="utf-8") as ef:
                      ef.write("\n".join(f"- {e}" for e in errors))
                  print("\n❌ Errores en los commits.")
              else:
                  print("\n✅ Todos los commits cumplen el estándar.")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          
          python validate.py

      - name: Comentar errores en el PR
        if: steps.validate.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "❌ **Se encontraron errores en el Pull Request**"
            echo ""
            cat errors.txt
            echo ""
            echo "Por favor, corrige el título o la descripción para que cumplan con el estándar en inglés. El bot volverá a evaluar los cambios automáticamente."
          } > comment.md
          gh pr comment "${PR_URL}" --body-file comment.md
        
          # Forzar fallo del workflow para bloquear el PR sin cerrarlo
          exit 1