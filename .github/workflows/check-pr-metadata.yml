name: Check PR Metadata

on:
  workflow_call:
    secrets: {}

permissions:
  pull-requests: write

jobs:
  validate-pr:
    name: Validar título y descripción del PR
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtener metadatos del PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr view "${PR_URL}" --json title,body > pr_data.json

      - name: Validar estructura e idioma
        id: validate
        run: |
          cat << 'PYEOF' > validate.py
          import json, os, re, sys

          CONVENTIONAL_PATTERN = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-zA-Z0-9_-]+\))?: (.+)$"
          )

          def check_language(text):
              # Busca caracteres típicamente usados en español (ñ, tildes, símbolos de apertura)
              spanish_chars = re.compile(r'[áéíóúÁÉÍÓÚñÑüÜ¿¡]')
              if spanish_chars.search(text):
                  return False
              return True

          def main():
              with open("pr_data.json", encoding="utf-8") as f:
                  data = json.load(f)

              title = data.get("title", "") or ""
              body = data.get("body", "") or ""

              errors = []

              # --- Validación de Título ---
              match = CONVENTIONAL_PATTERN.match(title.strip())
              if not match:
                  errors.append(f"El título del PR no sigue Conventional Commits: '{title}'")
              elif not check_language(match.group(3)):
                  errors.append(f"El título contiene caracteres en español (ñ, tildes, etc.): '{title}'")

              # --- Validación de Cuerpo ---
              if body.strip() and not check_language(body):
                  errors.append("La descripción contiene caracteres en español (ñ, tildes, etc.).")

              github_output = os.environ["GITHUB_OUTPUT"]
              with open(github_output, "a", encoding="utf-8") as gh_out:
                  gh_out.write(f"valid={'false' if errors else 'true'}\n")

              if errors:
                  with open("errors.txt", "w", encoding="utf-8") as ef:
                      ef.write("\n".join(f"- {e}" for e in errors))
                  print("\n❌ Errores en los metadatos del PR.")
              else:
                  print("\n✅ Título y descripción cumplen el estándar.")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          
          python validate.py

      - name: Comentar y cerrar PR
        if: steps.validate.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "❌ **Pull Request rechazado (Metadatos)**"
            echo ""
            cat errors.txt
            echo ""
            echo "Corrige el título/descripción y haz clic en **Reopen Pull Request**."
          } > comment.md
          gh pr comment "${PR_URL}" --body-file comment.md
          gh pr close "${PR_URL}"
          exit 1