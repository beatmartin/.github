name: Check PR Metadata

on:
  workflow_call:
    secrets: {}

permissions:
  pull-requests: write

jobs:
  validate-pr:
    name: Validate PR title and description
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr view "${PR_URL}" --json title,body > pr_data.json

      - name: Validate structure and language
        id: validate
        run: |
          cat << 'PYEOF' > validate.py
          import json, os, re, sys

          CONVENTIONAL_PATTERN = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-zA-Z0-9_-]+\))?: (.+)$"
          )

          def check_language(text):
              # Looks for characters typically used in Spanish
              spanish_chars = re.compile(r'[áéíóúÁÉÍÓÚñÑüÜ¿¡]')
              if spanish_chars.search(text):
                  return False
              return True

          def main():
              with open("pr_data.json", encoding="utf-8") as f:
                  data = json.load(f)

              title = data.get("title", "") or ""
              body = data.get("body", "") or ""

              errors = []

              # --- Title Validation ---
              match = CONVENTIONAL_PATTERN.match(title.strip())
              if not match:
                  errors.append(f"PR title does not follow Conventional Commits: '{title}'")
              elif not check_language(match.group(3)):
                  errors.append(f"PR title contains Spanish characters (ñ, accents, etc.): '{title}'")

              # --- Body Validation ---
              if body.strip() and not check_language(body):
                  errors.append("PR description contains Spanish characters (ñ, accents, etc.).")

              github_output = os.environ["GITHUB_OUTPUT"]
              with open(github_output, "a", encoding="utf-8") as gh_out:
                  gh_out.write(f"valid={'false' if errors else 'true'}\n")

              if errors:
                  with open("errors.txt", "w", encoding="utf-8") as ef:
                      ef.write("\n".join(f"- {e}" for e in errors))
                  print("\n[X] PR metadata errors found.")
              else:
                  print("\n[OK] Title and description meet the standard.")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          
          python validate.py

      - name: Comment and close PR
        if: steps.validate.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "### [X] Pull Request Rejected (Metadata)"
            echo ""
            echo "The following issues were found with the Pull Request metadata:"
            cat errors.txt
            echo ""
            echo "---"
            echo "### [i] How to fix this:"
            echo "1. Click the **Edit** button at the top right of the Pull Request title or description."
            echo "2. Ensure the title follows the format: \`type(optional-scope): description in english\`."
            echo "3. Ensure both the title and body do not contain characters exclusive to Spanish (á, é, í, ó, ú, ñ)."
            echo "4. Once corrected, click **Reopen Pull Request** at the bottom of the page."
          } > comment.md
          gh pr comment "${PR_URL}" --body-file comment.md
          gh pr close "${PR_URL}"
          exit 1